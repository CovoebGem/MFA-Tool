name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0"
        required: true
        type: string
      platform:
        description: "Platform to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos-arm64
          - linux

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      tag: ${{ steps.select.outputs.tag }}

    steps:
      - name: Select platforms
        id: select
        shell: bash
        run: |
          platform='${{ inputs.platform || 'all' }}'
          tag='${{ inputs.tag || github.ref_name }}'

          windows='{"platform":"windows","label":"Windows","os":"windows-latest","args":"","rust-target":""}'
          macos_arm64='{"platform":"macos-arm64","label":"macOS Apple Silicon","os":"macos-latest","args":"--target aarch64-apple-darwin","rust-target":"aarch64-apple-darwin"}'
          linux='{"platform":"linux","label":"Linux","os":"ubuntu-22.04","args":"","rust-target":""}'

          case "$platform" in
            all)
              matrix="{\"include\":[$windows,$macos_arm64,$linux]}"
              ;;
            windows)
              matrix="{\"include\":[$windows]}"
              ;;
            macos-arm64)
              matrix="{\"include\":[$macos_arm64]}"
              ;;
            linux)
              matrix="{\"include\":[$linux]}"
              ;;
            *)
              echo "Unsupported platform: $platform" >&2
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo 'matrix<<JSON'
            echo "$matrix"
            echo 'JSON'
          } >> "$GITHUB_OUTPUT"

  build-release:
    name: Build ${{ matrix.label }} release
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        if: matrix.rust-target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with target
        if: matrix.rust-target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: MFA-Tool ${{ needs.prepare-release.outputs.tag }}
          releaseBody: |
            下载对应平台的安装包即可使用。

            默认发布平台：Windows、macOS Apple Silicon、Linux。
          releaseDraft: false
          prerelease: false
