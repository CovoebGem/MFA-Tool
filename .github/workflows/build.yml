name: Build Tauri App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.9"
        required: true
        type: string
      platform:
        description: "Platform to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos-arm64
          - linux

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release tag and versions
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      release_body: ${{ steps.meta.outputs.release_body }}
      is_full_release: ${{ steps.meta.outputs.is_full_release }}
      release_draft: ${{ steps.meta.outputs.release_draft }}

    steps:
      - name: Determine and validate target tag
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_TAG="$INPUT_TAG"
          else
            TARGET_TAG="$REF_NAME"
          fi

          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag format: $TARGET_TAG" >&2
            exit 1
          fi

          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout target tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.target.outputs.tag }}
          fetch-depth: 0

      - name: Verify main ancestry, versions, release state, and release notes
        id: meta
        env:
          TARGET_TAG: ${{ steps.target.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_PLATFORM: ${{ inputs.platform || 'all' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Tag $TARGET_TAG commit $(git rev-parse HEAD) is not an ancestor of origin/main" >&2
            exit 1
          fi

          VERSION="${TARGET_TAG#v}"
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const expected = process.env.VERSION;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const pkgLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const tauriConf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const cargoToml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            const cargoLock = fs.readFileSync("src-tauri/Cargo.lock", "utf8");

            const cargoTomlMatch = cargoToml.match(/^\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m);
            const cargoLockMatch = cargoLock.match(/\[\[package\]\]\r?\nname\s*=\s*"mfa-tool"\r?\nversion\s*=\s*"([^"]+)"/);

            const checks = [
              ["package.json", pkg.version],
              ["package-lock.json", pkgLock.version],
              ["package-lock.json packages[\"\"]", pkgLock.packages?.[""]?.version],
              ["src-tauri/tauri.conf.json", tauriConf.version],
              ["src-tauri/Cargo.toml", cargoTomlMatch?.[1]],
              ["src-tauri/Cargo.lock", cargoLockMatch?.[1]],
            ];

            for (const [file, actual] of checks) {
              if (actual !== expected) {
                console.error(`Version mismatch in ${file}: expected ${expected}, got ${actual}`);
                process.exit(1);
              }
            }
          '

          BODY="$(git for-each-ref --format='%(contents)' "refs/tags/$TARGET_TAG")"
          if [ -z "${BODY//[[:space:]]/}" ]; then
            BODY="MFA Tool $TARGET_TAG"
          fi

          if [ "$EVENT_NAME" = "push" ] || [ "$TARGET_PLATFORM" = "all" ]; then
            IS_FULL_RELEASE="true"
          else
            IS_FULL_RELEASE="false"
          fi

          RELEASE_DRAFT="$(
            IS_FULL_RELEASE="$IS_FULL_RELEASE" node -e '
              async function main() {
                const token = process.env.GH_TOKEN;
                const repo = process.env.REPO;
                const tag = process.env.TARGET_TAG;
                const isFull = process.env.IS_FULL_RELEASE === "true";
                const headers = {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json",
                  "User-Agent": "mfa-tool-release-preflight",
                };

                let existing = null;
                for (let page = 1; ; page += 1) {
                  const res = await fetch(
                    `https://api.github.com/repos/${repo}/releases?per_page=100&page=${page}`,
                    { headers },
                  );
                  if (!res.ok) {
                    throw new Error(`Failed to list releases: ${res.status}`);
                  }
                  const batch = await res.json();
                  existing = batch.find((r) => r.tag_name === tag) || null;
                  if (existing || batch.length < 100) {
                    break;
                  }
                }

                if (existing && !existing.draft) {
                  throw new Error(`Published release already exists for ${tag}; create a new version tag instead of modifying a published release in place`);
                }

                if (!isFull) {
                  if (!existing || !existing.draft) {
                    throw new Error(`Single-platform rebuild requires an existing draft release for ${tag}`);
                  }
                  process.stdout.write("true");
                  return;
                }

                process.stdout.write("true");
              }

              main().catch((err) => {
                console.error(err);
                process.exit(1);
              });
            '
          )"

          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "is_full_release=$IS_FULL_RELEASE" >> "$GITHUB_OUTPUT"
          echo "release_draft=$RELEASE_DRAFT" >> "$GITHUB_OUTPUT"

          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "release_body<<$DELIM"
            printf '%s\n' "$BODY"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows release
    needs: preflight
    if: needs.preflight.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: "MFA Tool ${{ needs.preflight.outputs.tag }}"
          releaseBody: ${{ needs.preflight.outputs.release_body }}
          releaseDraft: ${{ needs.preflight.outputs.release_draft == 'true' }}
          prerelease: false
          includeUpdaterJson: true

  build-macos-arm64:
    name: Build macOS Apple Silicon release
    needs: [preflight, build-windows]
    if: needs.preflight.result == 'success' && !cancelled() && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos-arm64')
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: --target aarch64-apple-darwin
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: "MFA Tool ${{ needs.preflight.outputs.tag }}"
          releaseBody: ${{ needs.preflight.outputs.release_body }}
          releaseDraft: ${{ needs.preflight.outputs.release_draft == 'true' }}
          prerelease: false
          includeUpdaterJson: true

  build-linux-debian12:
    name: Build Linux Debian 12 release
    needs: [preflight, build-windows, build-macos-arm64]
    if: needs.preflight.result == 'success' && !cancelled() && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') && (needs.build-macos-arm64.result == 'success' || needs.build-macos-arm64.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux')
    runs-on: ubuntu-24.04
    container:
      image: debian:12

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}

      - name: Install Debian 12 dependencies
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates \
            curl \
            wget \
            file \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libsecret-1-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: "MFA Tool ${{ needs.preflight.outputs.tag }}"
          releaseBody: ${{ needs.preflight.outputs.release_body }}
          releaseDraft: ${{ needs.preflight.outputs.release_draft == 'true' }}
          prerelease: false
          includeUpdaterJson: true

  publish-release:
    name: Verify updater manifest and publish release
    needs: [preflight, build-windows, build-macos-arm64, build-linux-debian12]
    if: needs.preflight.result == 'success' && needs.preflight.outputs.is_full_release == 'true' && needs.build-windows.result == 'success' && needs.build-macos-arm64.result == 'success' && needs.build-linux-debian12.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Verify draft release and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          node -e '
            async function run() {
              const token = process.env.GH_TOKEN;
              const repo = process.env.REPO;
              const tag = process.env.TARGET_TAG;
              const version = tag.replace(/^v/, "");
              const escVer = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const headers = {
                Authorization: `Bearer ${token}`,
                Accept: "application/vnd.github+json",
                "User-Agent": "mfa-tool-release-check",
              };

              let release = null;
              for (let page = 1; ; page += 1) {
                const listRes = await fetch(
                  `https://api.github.com/repos/${repo}/releases?per_page=100&page=${page}`,
                  { headers },
                );
                if (!listRes.ok) {
                  throw new Error(`Failed to list releases: ${listRes.status}`);
                }
                const releases = await listRes.json();
                release = releases.find((r) => r.tag_name === tag) || null;
                if (release || releases.length < 100) {
                  break;
                }
              }
              if (!release) {
                throw new Error(`Release not found for tag ${tag}`);
              }

              const assetsByName = new Map((release.assets || []).map((a) => [a.name, a]));
              const manifestAsset = assetsByName.get("latest.json");
              if (!manifestAsset) {
                throw new Error("latest.json asset missing from draft release");
              }

              const manifestRes = await fetch(manifestAsset.url, {
                headers: {
                  ...headers,
                  Accept: "application/octet-stream",
                },
              });
              if (!manifestRes.ok) {
                throw new Error(`Failed to fetch latest.json: ${manifestRes.status}`);
              }
              const manifest = await manifestRes.json();

              if (manifest.version !== version) {
                throw new Error(`Manifest version mismatch: expected ${version}, got ${manifest.version}`);
              }
              if (typeof manifest.notes !== "string" || !manifest.notes.trim()) {
                throw new Error("Manifest notes must not be empty");
              }

              const platformPatterns = {
                "windows-x86_64": new RegExp(`^MFA\\.Tool_${escVer}_x64[^/]*\\.msi$`),
                "windows-x86_64-msi": new RegExp(`^MFA\\.Tool_${escVer}_x64[^/]*\\.msi$`),
                "windows-x86_64-nsis": new RegExp(`^MFA\\.Tool_${escVer}_x64-setup\\.exe$`),
                "darwin-aarch64": /^MFA\.Tool_aarch64\.app\.tar\.gz$/,
                "darwin-aarch64-app": /^MFA\.Tool_aarch64\.app\.tar\.gz$/,
                "linux-x86_64": new RegExp(`^MFA\\.Tool_${escVer}_amd64\\.AppImage$`),
                "linux-x86_64-appimage": new RegExp(`^MFA\\.Tool_${escVer}_amd64\\.AppImage$`),
                "linux-x86_64-deb": new RegExp(`^MFA\\.Tool_${escVer}_amd64\\.deb$`),
                "linux-x86_64-rpm": new RegExp(`^MFA\\.Tool-${escVer}-1\\.x86_64\\.rpm$`),
              };
              const expectedPrefix = `https://github.com/${repo}/releases/download/${tag}/`;
              const sigCache = new Map();

              for (const [key, pattern] of Object.entries(platformPatterns)) {
                const entry = manifest.platforms?.[key];
                if (!entry) {
                  throw new Error(`Missing platform entry in latest.json: ${key}`);
                }
                if (typeof entry.signature !== "string" || !entry.signature.trim()) {
                  throw new Error(`Empty signature for ${key}`);
                }
                if (typeof entry.url !== "string" || !entry.url.startsWith(expectedPrefix)) {
                  throw new Error(`Unexpected asset URL for ${key}: ${entry.url}`);
                }
                const filename = entry.url.slice(expectedPrefix.length);
                if (!pattern.test(filename)) {
                  throw new Error(`Unexpected asset filename for ${key}: ${filename}`);
                }
                if (!assetsByName.has(filename)) {
                  throw new Error(`Referenced asset missing on release: ${filename}`);
                }
                const sigAsset = assetsByName.get(`${filename}.sig`);
                if (!sigAsset) {
                  throw new Error(`Missing signature asset on release: ${filename}.sig`);
                }
                let sigText = sigCache.get(sigAsset.name);
                if (sigText === undefined) {
                  const sigRes = await fetch(sigAsset.url, {
                    headers: {
                      ...headers,
                      Accept: "application/octet-stream",
                    },
                  });
                  if (!sigRes.ok) {
                    throw new Error(`Failed to download ${sigAsset.name}: ${sigRes.status}`);
                  }
                  sigText = await sigRes.text();
                  sigCache.set(sigAsset.name, sigText);
                }
                if (sigText.trim() !== entry.signature.trim()) {
                  throw new Error(`Signature content mismatch between ${sigAsset.name} and latest.json for ${key}`);
                }
              }

              if (release.draft) {
                const patchRes = await fetch(`https://api.github.com/repos/${repo}/releases/${release.id}`, {
                  method: "PATCH",
                  headers: {
                    ...headers,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ draft: false }),
                });
                if (!patchRes.ok) {
                  throw new Error(`Failed to publish release ${release.id}: ${patchRes.status}`);
                }
              }
              console.log(`Verified and published ${tag}`);
            }

            run().catch((err) => {
              console.error(err);
              process.exit(1);
            });
          '
